# Test on every push and pull request; deploy master to Heroku only when every suite passes.
#
#   unit         backend unit tests with coverage: offline, needs no secrets
#   integration  API + end-to-end (Chrome) tests against the Supabase project in the repository secrets;
#                read-only (the create/delete browser flows stay off in CI); skipped without secrets
#   deploy       master only: pushes to Heroku, then smoke-checks the live site
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET, FLASK_SECRET_KEY,
#   SUPABASE_S3_ENDPOINT, SUPABASE_S3_REGION, SUPABASE_S3_BUCKET, SUPABASE_S3_ACCESS_KEY_ID,
#   SUPABASE_S3_SECRET_ACCESS_KEY                      -> integration tests
#   HEROKU_API_KEY, HEROKU_APP_NAME                   -> deploy
#   SITE_URL (optional)                               -> smoke check URL (default https://<app>.herokuapp.com)
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'   # same as runtime.txt (Heroku)
  PYTHONIOENCODING: utf-8

jobs:
  config:
    name: Check configuration
    runs-on: ubuntu-latest
    outputs:
      has_db: ${{ steps.check.outputs.has_db }}
      has_heroku: ${{ steps.check.outputs.has_heroku }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "has_db=${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SUPABASE_JWT_SECRET != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_heroku=${{ env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != '' }}" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Backend unit tests (offline, with coverage)
        working-directory: app-backend
        run: python tests/run_all.py --only unit
      - name: Test summary
        if: always()
        run: cat app-backend/tests/reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: app-backend/tests/reports/
          retention-days: 14

  integration:
    name: API + end-to-end (Chrome)
    needs: [config, unit]
    if: needs.config.outputs.has_db == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      SUPABASE_S3_BUCKET: ${{ secrets.SUPABASE_S3_BUCKET }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium   # fallback when Google Chrome is missing
      - name: API and end-to-end tests (read-only)
        working-directory: app-backend
        run: python tests/run_all.py --only api --only e2e
      - name: Test summary
        if: always()
        run: cat app-backend/tests/reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            app-backend/tests/reports/
            app-backend/tests/e2e/reports/
            app-backend/tests/perf/reports/
          retention-days: 14

  deploy:
    name: Deploy to Heroku
    needs: [config, unit, integration]
    # Runs after the integration job passed, or was skipped only because no database secrets are set.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.config.outputs.has_heroku == 'true' && needs.unit.result == 'success' &&
      (needs.integration.result == 'success' || (needs.integration.result == 'skipped' && needs.config.outputs.has_db != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Heroku needs the full history to accept the push
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:refs/heads/main
      - name: Smoke check the live site
        id: smoke
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          url="${SITE_URL:-https://${HEROKU_APP_NAME}.herokuapp.com}"
          url="${url%/}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for path in / /login /robots.txt /sitemap.xml /llms.txt; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url$path" || echo 000)
              [ "$code" = "200" ] && break
              echo "$path -> $code (attempt $attempt), retrying"; sleep 10
            done
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$url$path returned $code after deploy"; exit 1; }
          done
