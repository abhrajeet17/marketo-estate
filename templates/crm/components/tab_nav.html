{# CRM section tabs — rendered inside the portal top bar (portal_header_include). #}
<div class="crm-tabs" id="crm-tabs">
    <div class="crm-tabs-top">
        <div class="crm-tabs-top-center">
            <div class="crm-tab-strip" id="crm-tab-strip" role="tablist" aria-label="CRM sections">
                <button class="crm-tab active" data-tab="interests" id="tab-interests" role="tab" type="button">Interests</button>
                <button class="crm-tab" data-tab="deals" id="tab-deals" role="tab" type="button">Deals</button>
                <button class="crm-tab" data-tab="contacts" id="tab-contacts" role="tab" type="button">Contacts</button>
                <button class="crm-tab" data-tab="allotted-clients" id="tab-allotted-clients" role="tab" type="button" style="display:none;">Allotted clients</button>
                <button class="crm-tab" data-tab="panoramas" id="tab-panoramas" role="tab" type="button" style="display:none;">Panoramas</button>
                <button class="crm-tab" data-tab="plots" id="tab-plots" role="tab" type="button">Plotted list</button>
                <button class="crm-tab" data-tab="projects" id="tab-projects" role="tab" type="button" style="display:none;">Projects</button>
                <button class="crm-tab" data-tab="masters" id="tab-masters" role="tab" type="button" style="display:none;">Masters</button>
                <button class="crm-tab" data-tab="manage-lock" id="tab-manage-lock" role="tab" type="button" style="display:none;">Manage lock</button>
            </div>
        </div>
        <div class="crm-tabs-top-right">
            <button class="crm-tab-action" id="btn-reports" type="button" title="Export the current tab to Excel" aria-label="Export the current tab to Excel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
        </div>
    </div>
</div>
