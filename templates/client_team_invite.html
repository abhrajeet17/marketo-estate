<!doctype html>
<html lang="en" class="ui-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team invitation · MarketoState</title>
  <link rel="icon" href="/static/Marketostate/Marketostate%20Favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Fragment+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/ui/charm.css?v={{ ui_asset_v }}">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
      background: radial-gradient(1200px 500px at 50% -10%, var(--ui-band), transparent 70%), var(--ui-canvas); }
    .invite { width: min(480px, 100%); display: flex; flex-direction: column; gap: 20px; }
    .invite__logo { height: 28px; width: auto; align-self: center; }
    .invite__card { padding: 28px; display: flex; flex-direction: column; gap: 18px; animation: ui-fade-up var(--ui-slow) var(--ui-ease) both; }
    .invite__meta { display: flex; flex-direction: column; margin: 0; border-radius: 16px; background: var(--ui-panel-sunken); padding: 4px 14px; }
    .invite__meta > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ui-line); font-size: var(--ui-text-sm); }
    .invite__meta > div:last-child { border-bottom: 0; }
    .invite__meta dt { color: var(--ui-muted); }
    .invite__meta dd { margin: 0; font-weight: 600; color: var(--ui-heading); text-align: right; overflow-wrap: anywhere; }
    .invite__actions { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <main class="invite">
    <img class="invite__logo" src="/static/Marketostate/Marketostate%20logo.png" alt="MarketoState">
    <section class="ui-card invite__card" id="invite-card" data-state="loading" aria-live="polite">
      <div data-for="loading" class="ui-stack" aria-hidden="true">
        <span class="ui-skel ui-skel--line" style="width:30%"></span>
        <span class="ui-skel ui-skel--title" style="width:80%;height:26px"></span>
        <span class="ui-skel" style="height:120px;border-radius:16px"></span>
        <span class="ui-skel" style="height:44px"></span>
      </div>
      <div data-for="ready" hidden class="ui-stack" style="gap:18px">
        <div>
          <div class="ui-eyebrow">Team invitation</div>
          <h1 class="ui-title" style="margin-top:8px;font-size:1.5rem" id="invite-title">You're invited</h1>
          <p class="ui-subtitle" style="margin-top:6px" id="invite-desc"></p>
        </div>
        <dl class="invite__meta">
          <div><dt>Team</dt><dd id="invite-team">—</dd></div>
          <div><dt>Email</dt><dd id="invite-email">—</dd></div>
          <div><dt>Role</dt><dd id="invite-role">—</dd></div>
        </dl>
        <div class="invite__actions">
          <button class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block" id="accept-btn" type="button">Accept invitation</button>
          <a class="ui-btn ui-btn--block" id="signin-btn" href="/login">Sign in to continue</a>
        </div>
        <div class="ui-alert" id="status" role="status"></div>
      </div>
      <div data-for="error" hidden class="ui-empty" style="padding:24px 8px">
        <span class="ui-empty__icon" style="background:var(--ui-danger-soft);color:var(--ui-danger-strong)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        </span>
        <div class="ui-empty__title">This invitation isn't available</div>
        <p class="ui-empty__text" id="invite-error-text">It may have expired or already been used. Ask the team admin to send a new one.</p>
        <a class="ui-btn" href="/login">Go to sign in</a>
      </div>
    </section>
  </main>

  <script src="/static/js/supabase.min.js"></script>
  <script src="/static/ui/charm.js?v={{ ui_asset_v }}"></script>
  <script>
  (function () {
    'use strict';
    var TOKEN = {{ (invite_token or '')|tojson }};
    var SUPABASE_URL = {{ (supabase_url or '')|tojson }};
    var SUPABASE_KEY = {{ (supabase_anon_key or '')|tojson }};
    var PENDING_INVITE_KEY = 'pending_client_team_invite_token_v1';
    var ROLE = { client_admin: 'Client admin', client_user: 'Sales agent', broker: 'Broker' };
    var C = window.Charm;
    var card = document.getElementById('invite-card');
    var acceptBtn = document.getElementById('accept-btn');
    var signinBtn = document.getElementById('signin-btn');
    var statusEl = document.getElementById('status');
    var details = null;
    var sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    function text(id, value) { document.getElementById(id).textContent = value; }
    function status(msg, tone) {
      statusEl.className = 'ui-alert' + (tone ? ' ui-alert--' + tone : '');
      statusEl.textContent = msg || '';
    }
    function authHref() {
      var mode = details && details.invited_user_exists ? 'signin' : 'signup';
      var href = '/login?client_invite=' + encodeURIComponent(TOKEN) + '&mode=' + mode;
      if (details && details.email) href += '&email=' + encodeURIComponent(String(details.email).trim());
      return href;
    }
    function session() {
      if (!sb) return Promise.resolve(null);
      return sb.auth.getSession().then(function (r) { return (r && r.data && r.data.session) || null; }).catch(function () { return null; });
    }

    Promise.all([
      fetch('/api/public/client-invite/' + encodeURIComponent(TOKEN)).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) throw new Error((d && d.error) || 'Invite not found');
          return d;
        });
      }),
      session()
    ]).then(function (res) {
      details = res[0] || {};
      var signedIn = !!(res[1] && res[1].access_token);
      var team = details.client_name || 'the team';
      text('invite-title', 'Join ' + team);
      text('invite-desc', (details.inviter_name || 'A team admin') + ' invited you to collaborate on MarketoState.');
      text('invite-team', details.client_name || '—');
      text('invite-email', details.email || '—');
      text('invite-role', ROLE[String(details.member_role || '').toLowerCase()] || 'Sales agent');
      signinBtn.textContent = details.invited_user_exists ? 'Sign in to continue' : 'Create your account';
      signinBtn.href = authHref();
      signinBtn.hidden = signedIn;
      acceptBtn.textContent = signedIn ? 'Accept invitation' : (details.invited_user_exists ? 'Sign in & accept' : 'Sign up & accept');
      if (String(details.status || 'pending').toLowerCase() !== 'pending') {
        acceptBtn.disabled = true;
        status('This invitation has already been ' + String(details.status).toLowerCase() + '.', 'warning');
      }
      C.setState(card, 'ready');
    }).catch(function (e) {
      text('invite-error-text', (e && e.message ? e.message + '. ' : '') + 'Ask the team admin to send a new invitation.');
      C.setState(card, 'error');
    });

    acceptBtn.addEventListener('click', function () {
      try { window.localStorage.setItem(PENDING_INVITE_KEY, TOKEN); } catch (e) { /* ignore */ }
      C.busy(acceptBtn, true);
      status('');
      session().then(function (s) {
        if (!s || !s.access_token) { window.location.href = authHref(); return null; }
        return fetch('/api/client-team-invites/accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token },
          body: JSON.stringify({ invite_token: TOKEN })
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            if (!r.ok) throw new Error((d && d.error) || 'Failed to accept invite');
            try {
              window.localStorage.removeItem(PENDING_INVITE_KEY);
              window.sessionStorage.removeItem('portal_identity_v1');
            } catch (e) { /* ignore */ }
            status('You joined ' + (details.client_name || 'the team') + '. Taking you to your dashboard…', 'success');
            setTimeout(function () { window.location.href = '/customer-dashboard'; }, 900);
          });
        });
      }).catch(function (e) {
        status((e && e.message) || 'Could not accept the invite', 'danger');
        C.busy(acceptBtn, false);
      });
    });
  })();
  </script>
</body>
</html>
