<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Map Editor – MarketoState</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/building_map_admin.css?v=20261017-1">
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading building map...</div>
</div>

<!-- Full-screen image container with canvas overlay -->
<div class="bma-container" id="bma-container">
    <div class="bma-image-wrap" id="bma-image-wrap">
        <img class="bma-image" id="bma-image" src="" alt="Building Map" draggable="false">
        <canvas class="bma-canvas" id="bma-canvas"></canvas>
    </div>
</div>

<!-- Top-left header bar -->
<div class="bma-ui-overlay">
    <div class="bma-header">
        <div class="bma-header-left">
            <a href="/building-plans" class="bma-back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                Back
            </a>
            <span class="bma-map-name" id="bma-map-name" contenteditable="true" spellcheck="false" title="Rename"></span>
        </div>
        <div class="bma-header-right">
        </div>
    </div>

    <!-- Zoom controls (top-right) -->
    <div class="bma-zoom-controls">
        <button class="bma-zoom-btn" id="bma-zoom-in" title="Zoom in">+</button>
        <button class="bma-zoom-btn" id="bma-zoom-out" title="Zoom out">&minus;</button>
        <button class="bma-zoom-btn" id="bma-zoom-reset" title="Reset zoom" style="font-size:0.72rem;">&#8634;</button>
    </div>
</div>

<!-- Edit panel (bottom-left floating) -->
<div class="bma-edit-panel floating-panel" id="bma-edit-panel">
    <div class="panel-header">
        <span class="panel-title">Editor</span>
        <button class="panel-toggle-btn" id="bma-panel-toggle" title="Collapse">&minus;</button>
    </div>
    <div class="panel-body" id="bma-panel-body">

        <!-- Customer view settings -->
        <div class="bma-section-header">
            <span class="bma-section-title">Customer View</span>
            <a class="bma-preview-link" id="bma-preview-link" href="#" target="_blank" rel="noopener">Preview &#8599;</a>
        </div>
        <div class="bma-linked-from" id="bma-linked-from"></div>
        <div class="bma-settings-grid">
            <label class="bma-mini-field">
                <span>This map is</span>
                <select class="form-input" id="bma-view-level">
                    <option value="">Auto (by link depth)</option>
                    <option value="aerial">Building group (aerial)</option>
                    <option value="tower">Building (floors)</option>
                    <option value="floor">Floor map (units)</option>
                </select>
            </label>
            <div class="bma-settings-grid" id="bma-root-settings" hidden>
            <label class="bma-mini-field">
                <span>Brand label</span>
                <input class="form-input" id="bma-brand-name" maxlength="60" placeholder="Project name">
            </label>
            <label class="bma-mini-field">
                <span>RERA number</span>
                <input class="form-input" id="bma-rera" maxlength="120" placeholder="From project if empty">
            </label>
            <label class="bma-mini-field">
                <span>VR tour URL</span>
                <input class="form-input" id="bma-vr-url" maxlength="500" placeholder="Optional">
            </label>
            <label class="bma-check">
                <input type="checkbox" id="bma-show-interest" checked>
                <span>Show Interest</span>
            </label>
            </div>
        </div>

        <div class="bma-sep"></div>

        <!-- Catalogue link -->
        <div class="form-group" style="margin-bottom:0.75rem;">
            <label class="form-label" style="font-size:0.75rem; margin-bottom:0.25rem;">Floor Plan Catalogue</label>
            <select class="form-input" id="bma-catalogue-select" style="font-size:0.8rem; padding:0.35rem 0.5rem;">
                <option value="">— None —</option>
            </select>
        </div>

        <div class="bma-sep"></div>

        <!-- Zones section -->
        <div class="bma-section-header">
            <span class="bma-section-title">Zones</span>
            <span class="bma-section-badge" id="bma-zone-count">0</span>
        </div>

        <div class="bma-draw-controls" id="bma-draw-controls" hidden>
            <span class="bma-edit-instruction" id="bma-edit-instruction"></span>
            <div class="bma-edit-actions">
                <button class="bma-edit-btn primary" id="bma-complete-draw" disabled>Done</button>
                <button class="bma-edit-btn secondary" id="bma-cancel-draw">Cancel</button>
            </div>
        </div>

        <div class="bma-sep"></div>

        <!-- Floor filter -->
        <div class="bma-floor-filter">
            <span class="bma-panel-subtitle">Floor</span>
            <select class="bma-floor-select" id="bma-floor-filter">
                <option value="all">All Floors</option>
            </select>
        </div>

        <!-- Zones list -->
        <div class="bma-zones-list" id="bma-zones-list"></div>
    </div>
</div>

<!-- Zone form modal (floating, draggable, collapsible — NO backdrop) -->
<div class="bma-modal-float" id="bma-zone-modal" style="display:none;">
    <div class="bma-modal-titlebar" data-drag-handle="bma-zone-modal">
        <span class="bma-modal-titlebar-text" id="bma-zone-modal-title">New Zone</span>
        <button class="bma-modal-titlebar-btn" data-collapse="bma-zone-modal" title="Collapse">&minus;</button>
        <button class="bma-modal-titlebar-btn close-btn" data-close="bma-zone-modal" title="Close">&times;</button>
    </div>
    <div class="bma-modal-content">
        <div class="bma-modal-body">
            <div class="form-group">
                <label class="form-label">Zone Name</label>
                <input type="text" class="form-input" id="bma-zone-name" maxlength="200" placeholder="e.g., Floor 1 - Unit A">
            </div>
            <div class="form-group">
                <label class="form-label">Floor Number</label>
                <select class="form-input" id="bma-zone-floor">
                    <script>for(var i=0;i<=100;i++){document.write('<option value="'+i+'">'+i+'</option>');}</script>
                </select>
            </div>
            <div class="bma-split" id="bma-split-wrap" hidden>
                <label class="bma-check"><input type="checkbox" id="bma-split-on"><span>Split this outline into floor bands</span></label>
                <div class="bma-meta-grid" id="bma-split-fields" hidden>
                    <label class="bma-mini-field"><span>Number of floors</span><input class="form-input" type="number" id="bma-split-count" min="1" max="100" value="10"></label>
                    <label class="bma-mini-field"><span>Lowest floor no.</span><input class="form-input" type="number" id="bma-split-start" min="0" max="100" value="1"></label>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">When clicked, open</label>
                <div class="bma-link-types" id="bma-link-types" role="radiogroup">
                    <button type="button" class="bma-dir-btn" data-link="building_map" role="radio">Building map</button>
                    <button type="button" class="bma-dir-btn" data-link="floor_plan" role="radio">Floor plan</button>
                    <button type="button" class="bma-dir-btn" data-link="panorama" role="radio">Panorama</button>
                    <button type="button" class="bma-dir-btn" data-link="" role="radio">Unit details</button>
                </div>
            </div>
            <div class="form-group" data-link-group="building_map">
                <label class="form-label">Building map</label>
                <div class="bma-inline">
                    <select class="form-input" id="bma-zone-building-map">
                        <option value="">— Select —</option>
                    </select>
                    <button type="button" class="bma-edit-btn secondary" id="bma-upload-map-btn" title="Upload a new building map image for this zone">Upload new</button>
                    <input type="file" id="bma-upload-map-file" accept="image/png,image/jpeg,image/webp" hidden>
                </div>
                <div class="bma-upload-status" id="bma-upload-status" hidden></div>
            </div>
            <div class="form-group" data-link-group="floor_plan">
                <label class="form-label">Floor plan</label>
                <select class="form-input" id="bma-zone-floorplan">
                    <option value="">— Select —</option>
                </select>
            </div>
            <div class="form-group" data-link-group="panorama">
                <label class="form-label">Panorama</label>
                <select class="form-input" id="bma-zone-panorama">
                    <option value="">— Select —</option>
                </select>
            </div>

            <div class="bma-floor-units" id="bma-floor-units" hidden>
                <div class="bma-card-head">Units on this floor</div>
                <div class="bma-floor-units-list" id="bma-floor-units-list"></div>
            </div>
            <div class="bma-card-head">Info card</div>
            <div class="bma-meta-grid">
                <label class="bma-mini-field" data-levels="aerial floor"><span>Short label</span><input class="form-input" data-meta="label" maxlength="40" placeholder="e.g. T5 / 3202"></label>
                <label class="bma-mini-field" data-levels="tower floor"><span>Unit status</span>
                    <select class="form-input" data-meta="status">
                        <option value="">—</option>
                        <option value="available">Available</option>
                        <option value="sold">Sold</option>
                        <option value="hold">Hold</option>
                    </select>
                </label>
                <label class="bma-mini-field" data-levels="aerial"><span>Floors</span><input class="form-input" data-meta="floors" type="number" min="0" placeholder="41"></label>
                <label class="bma-mini-field" data-levels="aerial tower"><span>Apartments</span><input class="form-input" data-meta="units" type="number" min="0" placeholder="162"></label>
                <label class="bma-mini-field bma-span2" data-levels="aerial tower"><span>Configurations</span><input class="form-input" data-meta="configurations" maxlength="120" placeholder="2BHK, 3BHK, 4BHK"></label>
                <label class="bma-mini-field" data-levels="aerial tower"><span>Size from (sq ft)</span><input class="form-input" data-meta="size_min" type="number" min="0" placeholder="2440"></label>
                <label class="bma-mini-field" data-levels="aerial tower"><span>Size to (sq ft)</span><input class="form-input" data-meta="size_max" type="number" min="0" placeholder="6780"></label>
                <label class="bma-mini-field bma-span2" data-levels="floor"><span>Unit type</span><input class="form-input" data-meta="unit_type" maxlength="120" placeholder="B1 - 4BHK + Study + Utility"></label>
                <label class="bma-mini-field" data-levels="floor"><span>Total area</span><input class="form-input" data-meta="area" maxlength="60" placeholder="3660 Sq. Ft."></label>
                <label class="bma-mini-field" data-levels="floor"><span>Price</span><input class="form-input" data-meta="price" maxlength="60" placeholder="Optional"></label>
            </div>
            <div class="bma-form-error" id="bma-zone-error" role="alert" hidden></div>
        </div>
        <div class="bma-modal-actions">
            <button class="bma-modal-btn secondary" data-close="bma-zone-modal">Cancel</button>
            <button class="bma-modal-btn primary" id="bma-zone-save">Save Zone</button>
        </div>
    </div>
</div>

<!-- Replicate modal (floating, draggable, collapsible — NO backdrop) -->
<div class="bma-modal-float" id="bma-replicate-modal" style="display:none;">
    <div class="bma-modal-titlebar" data-drag-handle="bma-replicate-modal">
        <span class="bma-modal-titlebar-text">Replicate Zone</span>
        <button class="bma-modal-titlebar-btn" data-collapse="bma-replicate-modal" title="Collapse">&minus;</button>
        <button class="bma-modal-titlebar-btn close-btn" data-close="bma-replicate-modal" title="Close">&times;</button>
    </div>
    <div class="bma-modal-content">
        <div class="bma-modal-body">
            <div class="form-group">
                <label class="form-label">New Zone Name</label>
                <input type="text" class="form-input" id="bma-rep-name" maxlength="200" placeholder="e.g., Floor 2 - Unit A">
            </div>
            <div class="bma-form-error" id="bma-rep-error" role="alert" hidden></div>
            <div class="form-group">
                <label class="form-label">Floor Number</label>
                <select class="form-input" id="bma-rep-floor">
                    <script>for(var i=0;i<=100;i++){document.write('<option value="'+i+'">'+i+'</option>');}</script>
                </select>
            </div>
        </div>
        <div class="bma-modal-actions">
            <button class="bma-modal-btn secondary" data-close="bma-replicate-modal">Cancel</button>
            <button class="bma-modal-btn primary" id="bma-rep-confirm">Save Copy</button>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="bma-toast-container" id="bma-toast-container"></div>

<script src="/static/js/supabase.min.js"></script>
<script>
(function() {
    var MAP_ID = {{ map_id|tojson }};

    // GETs retry once on a transient 502/503 (e.g. the server briefly losing its DB connection).
    var _nativeFetch = window.fetch.bind(window);
    function fetch(url, opts) {
        var method = String((opts && opts.method) || 'GET').toUpperCase();
        return _nativeFetch(url, opts).then(function(r) {
            if (method === 'GET' && (r.status === 502 || r.status === 503) && !(opts && opts._retried)) {
                return new Promise(function(res) { setTimeout(res, 350); })
                    .then(function() { return fetch(url, Object.assign({}, opts || {}, { _retried: true })); });
            }
            return r;
        });
    }

    var SUPABASE_URL = {{ (supabase_url or '')|tojson }};
    var SUPABASE_ANON_KEY = {{ (supabase_anon_key or '')|tojson }};

    // ── Auth ──
    var accessToken = null;
    var sb = null;

    function initAuth() {
        return new Promise(function(resolve, reject) {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { reject('No config'); return; }
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            // Keep the bearer token current while the editor stays open (tokens expire hourly).
            sb.auth.onAuthStateChange(function(evt, session) {
                if (session && session.access_token) accessToken = session.access_token;
            });
            sb.auth.getSession().then(function(res) {
                var s = res && res.data && res.data.session;
                if (!s || !s.access_token) return null;
                var expMs = (s.expires_at || 0) * 1000;
                if (expMs && expMs - Date.now() < 60000) {
                    return sb.auth.refreshSession().then(function(r) { return r && r.data && r.data.session; });
                }
                return s;
            }).then(function(s) {
                if (!s || !s.access_token) {
                    window.location.href = '/login';
                    reject('No session');
                    return;
                }
                accessToken = s.access_token;
                resolve();
            }).catch(function() {
                window.location.href = '/login';
                reject('No session');
            });
        });
    }

    function authHeaders() {
        return { 'Authorization': 'Bearer ' + accessToken };
    }

    // ── State ──
    var mapData = null;
    var zones = [];
    var panoramas = [];
    var floorPlanItems = [];
    var buildingMaps = [];
    var zoneLinkType = '';

    var isDrawMode = true;   // always on: click adds points, drag pans, click a zone to edit it
    var suppressClick = false;
    var downX = 0, downY = 0;
    var isDrawing = false;
    var currentPoints = [];
    var selectedColor = 'green';
    var editingZoneId = null;

    var scale = 1;
    var panX = 0, panY = 0;
    var isDragging = false;
    var dragStartX, dragStartY, startPanX, startPanY;
    var imgNatW = 0, imgNatH = 0;

    // Screen pixels: thin floor bands (≈14 image px) must not auto-close on their 4th corner.
    var CLOSE_DISTANCE_PX = 7;
    var CLICK_DELAY_MS = 220;
    var clickTimer = null;
    var ignoreClick = false;

    var replicateSourceZone = null;
    var replicatePreviewPoints = null;
    var isReplicateDragging = false;
    var replicateDragStartCoords = null;
    var replicateOriginalPoints = null;

    // ── DOM refs ──
    var container = document.getElementById('bma-container');
    var imageWrap = document.getElementById('bma-image-wrap');
    var imgEl = document.getElementById('bma-image');
    var canvas = document.getElementById('bma-canvas');
    var ctx = canvas.getContext('2d');
    var loading = document.getElementById('loading-overlay');

    // ── Color map ──
    var COLOR_MAP = {
        green:  { stroke: 'rgba(34,197,94,0.9)',  fill: 'rgba(34,197,94,0.22)',  fillHi: 'rgba(34,197,94,0.4)' },
        orange: { stroke: 'rgba(249,115,22,0.9)', fill: 'rgba(249,115,22,0.22)', fillHi: 'rgba(249,115,22,0.4)' },
        red:    { stroke: 'rgba(239,68,68,0.9)',  fill: 'rgba(239,68,68,0.22)',  fillHi: 'rgba(239,68,68,0.4)' },
        blue:   { stroke: 'rgba(59,130,246,0.9)', fill: 'rgba(59,130,246,0.22)', fillHi: 'rgba(59,130,246,0.4)' },
        purple: { stroke: 'rgba(168,85,247,0.9)', fill: 'rgba(168,85,247,0.22)', fillHi: 'rgba(168,85,247,0.4)' }
    };

    // ── Init ──
    initAuth().then(function() {
        loadMapData();
        loadPanoramas();
        loadFloorPlanItems();
        loadBuildingMaps();
    });

    function jsonOrThrow(r) {
        return r.json().catch(function() { return {}; }).then(function(d) {
            if (!r.ok) throw new Error((d && d.error) || ('Request failed (' + r.status + ')'));
            return d;
        });
    }

    function loadBuildingMaps() {
        return fetch('/api/building-maps/flow', { headers: authHeaders() })
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(list) {
                buildingMaps = Array.isArray(list) ? list : [];
                populateBuildingMapSelect();
                renderLinkedFrom();
                updateZonesList();
            })
            .catch(function() { buildingMaps = []; });
    }

    function populateBuildingMapSelect(selected) {
        var sel = document.getElementById('bma-zone-building-map');
        var cur = selected !== undefined ? selected : sel.value;
        var ws = mapData ? (mapData.workspace_id || null) : null;
        var opts = buildingMaps.filter(function(m) { return String(m.id) !== String(MAP_ID); });
        // Same-project maps first.
        opts.sort(function(a, b) {
            var sa = (a.workspace_id || null) === ws ? 0 : 1, sb2 = (b.workspace_id || null) === ws ? 0 : 1;
            return sa - sb2 || String(a.name).localeCompare(String(b.name));
        });
        sel.innerHTML = '<option value="">— Select —</option>' + opts.map(function(m) {
            var lvl = m.view_config && m.view_config.level ? ' · ' + m.view_config.level : '';
            return '<option value="' + m.id + '">' + esc(m.name) + esc(lvl) + '</option>';
        }).join('');
        if (cur) sel.value = cur;
    }

    function renderLinkedFrom() {
        var el = document.getElementById('bma-linked-from');
        var parents = [];
        buildingMaps.forEach(function(m) {
            (m.zones || []).forEach(function(z) {
                if (z.link === 'building_map' && String(z.target) === String(MAP_ID)) parents.push({ map: m, zone: z });
            });
        });
        document.getElementById('bma-root-settings').hidden = parents.length > 0;
        if (!parents.length) {
            el.innerHTML = '';
            return;
        }
        el.innerHTML = parents.map(function(p) {
            return '<a href="/building-map/admin/' + p.map.id + '">' + esc(p.map.name) + '</a> &rsaquo; ' + esc(p.zone.name);
        }).join(', ');
    }

    function mapNameById(id) {
        var m = buildingMaps.find(function(x) { return String(x.id) === String(id); });
        return m ? m.name : 'Building map';
    }

    function fillSettings() {
        var cfg = (mapData && mapData.view_config) || {};
        document.getElementById('bma-view-level').value = cfg.level || '';
        document.getElementById('bma-brand-name').value = cfg.brand_name || '';
        document.getElementById('bma-rera').value = cfg.rera_number || '';
        document.getElementById('bma-vr-url').value = cfg.vr_tour_url || '';
        document.getElementById('bma-show-interest').checked = cfg.show_interest !== false;
        var link = document.getElementById('bma-preview-link');
        if (mapData && mapData.share_url) link.href = mapData.share_url;
    }

    // Rename by editing the title in place (Enter or blur saves, Esc cancels).
    (function() {
        var el = document.getElementById('bma-map-name');
        el.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
            else if (e.key === 'Escape') { el.textContent = (mapData && mapData.name) || ''; el.blur(); }
        });
        el.addEventListener('blur', function() {
            var name = el.textContent.replace(/\s+/g, ' ').trim();
            if (!mapData || !name || name === mapData.name) { el.textContent = (mapData && mapData.name) || ''; return; }
            fetch('/api/building-maps/' + MAP_ID, {
                method: 'PATCH',
                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                body: JSON.stringify({ name: name })
            })
            .then(jsonOrThrow)
            .then(function(d) { mapData.name = d.name || name; el.textContent = mapData.name; showToast('Renamed'); })
            .catch(function(err) { el.textContent = mapData.name; showToast(err.message, true); });
        });
    })();

    // Settings save as you edit (no Save button).
    var settingsTimer = null;
    function saveSettings() {
        var cfg = {
            level: document.getElementById('bma-view-level').value,
            brand_name: document.getElementById('bma-brand-name').value.trim(),
            rera_number: document.getElementById('bma-rera').value.trim(),
            vr_tour_url: document.getElementById('bma-vr-url').value.trim(),
            show_interest: document.getElementById('bma-show-interest').checked
        };
        fetch('/api/building-maps/' + MAP_ID, {
            method: 'PATCH',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ view_config: cfg })
        })
        .then(jsonOrThrow)
        .then(function(data) {
            mapData.view_config = data.view_config || cfg;
            showToast('Saved');
        })
        .catch(function(err) { showToast(err.message, true); });
    }
    ['bma-view-level', 'bma-show-interest'].forEach(function(id) {
        document.getElementById(id).addEventListener('change', saveSettings);
    });
    ['bma-brand-name', 'bma-rera', 'bma-vr-url'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', function() {
            clearTimeout(settingsTimer);
            settingsTimer = setTimeout(saveSettings, 700);
        });
    });

    function loadMapData() {
        fetch('/api/building-maps/' + MAP_ID, { headers: authHeaders() })
            .then(function(r) {
                if (r.status === 401 || r.status === 403) throw new Error('access');
                if (!r.ok) throw new Error('Not found');
                return r.json();
            })
            .then(function(data) {
                mapData = data;
                zones = data.zones || [];
                document.getElementById('bma-map-name').textContent = data.name || 'Building Map';
                fillSettings();
                populateBuildingMapSelect();
                imgEl.src = data.image_url;
                imgEl.onload = function() {
                    imgNatW = imgEl.naturalWidth;
                    imgNatH = imgEl.naturalHeight;
                    canvas.width = imgNatW;
                    canvas.height = imgNatH;
                    resetTransform();
                    renderAllZones();
                    updateZonesList();
                    updateFloorFilter();
                    loading.classList.add('hidden');
                };
            })
            .catch(function(err) {
                loading.querySelector('.loading-spinner').style.display = 'none';
                loading.querySelector('.loading-text').innerHTML = err && err.message === 'access'
                    ? 'No access to this map. <a href="/building-plans">Building Plans</a>'
                    : 'Failed to load building map. <a href="javascript:location.reload()">Retry</a>';
            });
        imgEl.onerror = function() {
            loading.querySelector('.loading-spinner').style.display = 'none';
            loading.querySelector('.loading-text').innerHTML = 'The map image could not be loaded. <a href="javascript:location.reload()">Retry</a>';
        };
    }

    // ── Load panoramas and floor plan items ──
    function loadPanoramas() {
        fetch('/api/panoramas', { headers: authHeaders() })
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(data) {
                panoramas = Array.isArray(data) ? data : (data.panoramas || []);
                populatePanoramaSelect();
            })
            .catch(function() { panoramas = []; });
    }

    var allCatalogues = [];

    function loadFloorPlanItems() {
        fetch('/api/floorplans/catalogues', { headers: authHeaders() })
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(cats) {
                allCatalogues = cats;
                populateCatalogueSelect();
                var promises = cats.map(function(c) {
                    return fetch('/api/floorplans/catalogues/' + c.id + '/items', { headers: authHeaders() })
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(items) {
                            return items.map(function(it) {
                                it._catalogue_name = c.name;
                                it._catalogue_id = c.id;
                                return it;
                            });
                        });
                });
                return Promise.all(promises);
            })
            .then(function(results) {
                floorPlanItems = [];
                results.forEach(function(arr) { floorPlanItems = floorPlanItems.concat(arr); });
                populateFloorPlanSelect();
            })
            .catch(function() { floorPlanItems = []; });
    }

    function populateCatalogueSelect() {
        var sel = document.getElementById('bma-catalogue-select');
        sel.innerHTML = '<option value="">— None —</option>';
        allCatalogues.forEach(function(c) {
            sel.innerHTML += '<option value="' + c.id + '">' + esc(c.name) + ' (' + (c.item_count || 0) + ' plans)</option>';
        });
        // Set current value from mapData
        if (mapData && mapData.catalogue_id) {
            sel.value = mapData.catalogue_id;
        }
    }

    // Save catalogue change
    document.getElementById('bma-catalogue-select').addEventListener('change', function() {
        var catId = this.value || null;
        fetch('/api/building-maps/' + MAP_ID, {
            method: 'PATCH',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ catalogue_id: catId })
        }).then(jsonOrThrow)
          .then(function(data) {
              if (data && data.catalogue_id !== undefined) {
                  mapData.catalogue_id = data.catalogue_id;
                  populateFloorPlanSelect();
                  showToast('Floor plan catalogue saved');
              }
          })
          .catch(function(err) { showToast(err.message, true); });
    });

    function populatePanoramaSelect() {
        var sel = document.getElementById('bma-zone-panorama');
        sel.innerHTML = '<option value="">— Select —</option>';
        panoramas.forEach(function(p) {
            sel.innerHTML += '<option value="' + p.id + '">' + esc(p.name) + '</option>';
        });
    }

    function populateFloorPlanSelect() {
        var sel = document.getElementById('bma-zone-floorplan');
        var keep = sel.value;
        sel.innerHTML = '<option value="">— Select —</option>';
        var linkedCatId = mapData ? mapData.catalogue_id : null;
        floorPlanItems.forEach(function(fp) {
            // If a catalogue is linked, only show items from that catalogue
            if (linkedCatId && fp._catalogue_id !== linkedCatId) return;
            var label = linkedCatId ? fp.name : (fp._catalogue_name ? fp._catalogue_name + ' / ' + fp.name : fp.name);
            sel.innerHTML += '<option value="' + fp.id + '">' + esc(label) + '</option>';
        });
        if (keep) sel.value = keep;
    }

    // ── Zoom & Pan ──
    function resetTransform() {
        if (!imgNatW || !imgNatH) return;
        var cw = container.clientWidth;
        var ch = container.clientHeight;
        scale = Math.min(cw / imgNatW, ch / imgNatH, 1);
        panX = (cw - imgNatW * scale) / 2;
        panY = (ch - imgNatH * scale) / 2;
        applyTransform();
    }

    var lastRenderedScale = 0;
    function applyTransform() {
        imageWrap.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
        // Line widths and labels depend on scale: redraw when zoom changes (not on pan).
        if (lastRenderedScale && Math.abs(lastRenderedScale - scale) > 1e-6 && !currentPoints.length) renderAllZones();
        lastRenderedScale = scale;
    }

    document.getElementById('bma-zoom-in').addEventListener('click', function() {
        scale = Math.min(scale * 1.3, 5);
        applyTransform();
    });
    document.getElementById('bma-zoom-out').addEventListener('click', function() {
        scale = Math.max(scale / 1.3, 0.1);
        applyTransform();
    });
    document.getElementById('bma-zoom-reset').addEventListener('click', resetTransform);

    container.addEventListener('wheel', function(e) {
        e.preventDefault();
        var factor = e.deltaY > 0 ? 0.9 : 1.1;
        var rect = container.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;
        var newScale = Math.max(0.1, Math.min(5, scale * factor));
        panX = mx - (mx - panX) * (newScale / scale);
        panY = my - (my - panY) * (newScale / scale);
        scale = newScale;
        applyTransform();
    }, { passive: false });

    // Pan with mouse drag (when not in draw mode or when right-click)
    container.addEventListener('mousedown', function(e) {
        downX = e.clientX; downY = e.clientY;
        // Replicate preview drag
        if (replicatePreviewPoints && replicatePreviewPoints.length >= 3 && e.button === 0) {
            var repCoords = clientToImageCoords(e.clientX, e.clientY);
            if (pointInPolygon(repCoords, replicatePreviewPoints)) {
                isReplicateDragging = true;
                replicateDragStartCoords = repCoords;
                replicateOriginalPoints = replicatePreviewPoints.map(function(p) { return {x: p.x, y: p.y}; });
                container.style.cursor = 'move';
                e.preventDefault();
                return;
            }
        }
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        startPanX = panX;
        startPanY = panY;
        container.classList.add('dragging');
        e.preventDefault();
    });
    window.addEventListener('mousemove', function(e) {
        // Replicate preview drag
        if (isReplicateDragging && replicateOriginalPoints) {
            var coords = clientToImageCoords(e.clientX, e.clientY);
            var dx = coords.x - replicateDragStartCoords.x;
            var dy = coords.y - replicateDragStartCoords.y;
            replicatePreviewPoints = replicateOriginalPoints.map(function(p) {
                return { x: Math.round(p.x + dx), y: Math.round(p.y + dy) };
            });
            renderAllZones();
            return;
        }
        if (!isDragging) return;
        panX = startPanX + (e.clientX - dragStartX);
        panY = startPanY + (e.clientY - dragStartY);
        applyTransform();
    });
    window.addEventListener('mouseup', function(e) {
        // A drag pans; it must not also drop a point.
        if (isDragging && Math.hypot(e.clientX - downX, e.clientY - downY) > 4) suppressClick = true;
        if (isReplicateDragging) {
            isReplicateDragging = false;
            container.style.cursor = '';
            return;
        }
        if (isDragging) {
            isDragging = false;
            container.classList.remove('dragging');
        }
    });

    // Touch support for pan and pinch
    var touchStartDist = 0, touchStartScale = 1;
    container.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
            touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            touchStartScale = scale;
        } else if (e.touches.length === 1 && !isDrawMode) {
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            startPanX = panX;
            startPanY = panY;
        }
    }, { passive: true });
    container.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
            e.preventDefault();
            var dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            scale = Math.max(0.1, Math.min(5, touchStartScale * (dist / touchStartDist)));
            applyTransform();
        } else if (isDragging && e.touches.length === 1) {
            panX = startPanX + (e.touches[0].clientX - dragStartX);
            panY = startPanY + (e.touches[0].clientY - dragStartY);
            applyTransform();
        }
    }, { passive: false });
    container.addEventListener('touchend', function() { isDragging = false; });

    // ── Coordinate conversion: client coords → image pixel coords ──
    function clientToImageCoords(clientX, clientY) {
        var rect = container.getBoundingClientRect();
        var x = (clientX - rect.left - panX) / scale;
        var y = (clientY - rect.top - panY) / scale;
        return { x: Math.round(x), y: Math.round(y) };
    }

    // ── Canvas rendering ──
    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawPolygon(points, color, highlight) {
        if (!points || points.length < 2) return;
        var c = COLOR_MAP[color] || COLOR_MAP.green;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (var i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        if (points.length >= 3) {
            ctx.closePath();
            ctx.fillStyle = highlight ? c.fillHi : c.fill;
            ctx.fill();
        }
        // Canvas units are image pixels; divide by the view scale so lines stay ~2px on screen.
        ctx.strokeStyle = highlight ? 'rgba(255,255,255,0.95)' : c.stroke;
        ctx.lineWidth = (highlight ? 2.5 : 2) / scale;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();
    }

    function getFilteredZones() {
        var filterFloor = document.getElementById('bma-floor-filter').value;
        return zones.filter(function(z) {
            if (filterFloor !== 'all' && String(z.floor_number) !== filterFloor) return false;
            return true;
        });
    }

    function renderAllZones() {
        clearCanvas();
        var filtered = getFilteredZones();
        filtered.forEach(function(z) {
            var pts = typeof z.points === 'string' ? JSON.parse(z.points) : z.points;
            if (pts && pts.length >= 3) {
                drawPolygon(pts, z.color || 'green', false);
                // Label only when the zone is tall/wide enough on screen; thin floor bands
                // would otherwise stack unreadable text (hover the list to identify them).
                var minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity;
                pts.forEach(function(p) { minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); });
                if ((maxY - minY) * scale < 18 || (maxX - minX) * scale < 40) return;
                var cx = 0, cy = 0;
                pts.forEach(function(p) { cx += p.x; cy += p.y; });
                cx /= pts.length; cy /= pts.length;
                ctx.font = 'bold ' + Math.round(14 / scale) + 'px Syne, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = 'rgba(0,0,0,0.45)';
                ctx.lineWidth = 3 / scale;
                ctx.lineJoin = 'round';
                ctx.strokeText(z.name, cx, cy);
                ctx.fillText(z.name, cx, cy);
            }
        });
        // Draw replicate preview if active
        if (replicatePreviewPoints && replicatePreviewPoints.length >= 3) {
            var repColor = replicateSourceZone ? (replicateSourceZone.color || 'green') : 'green';
            drawPolygon(replicatePreviewPoints, repColor, true);
            // Label
            var rcx = 0, rcy = 0;
            replicatePreviewPoints.forEach(function(p) { rcx += p.x; rcy += p.y; });
            rcx /= replicatePreviewPoints.length; rcy /= replicatePreviewPoints.length;
            ctx.font = 'bold ' + Math.round(14 / scale) + 'px Syne, sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 3;
            var repName = document.getElementById('bma-rep-name').value || '(copy)';
            ctx.strokeText(repName, rcx, rcy);
            ctx.fillText(repName, rcx, rcy);
        }
        // NOTE: currentPoints draft is NOT drawn here — handled separately
        // in mousemove preview and addPointAt to avoid double-alpha overlap
    }

    function renderDraft() {
        // Draw the current in-progress polygon (without hover point)
        if (currentPoints.length > 0) {
            drawPolygon(currentPoints, selectedColor, true);
            // Draw vertex dots
            currentPoints.forEach(function(p) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4 / scale, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = (COLOR_MAP[selectedColor] || COLOR_MAP.green).stroke;
                ctx.lineWidth = 2 / scale;
                ctx.stroke();
            });
        }
    }

    // ── Draw mode ──
    var drawControls = document.getElementById('bma-draw-controls');
    var completeDrawBtn = document.getElementById('bma-complete-draw');
    var cancelDrawBtn = document.getElementById('bma-cancel-draw');
    var editInstruction = document.getElementById('bma-edit-instruction');

    container.classList.add('edit-mode');
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && currentPoints.length && document.getElementById('bma-zone-modal').style.display === 'none') cancelDrawing();
    });

    function cancelDrawing() {
        currentPoints = [];
        isDrawing = false;
        completeDrawBtn.disabled = true;
        updateEditInstructionText();
        renderAllZones();
        if (isDrawMode) {
            editInstruction.textContent = '';
        }
    }

    function completeDrawing() {
        if (currentPoints.length < 3) return;
        currentPoints = simplifyPoints(currentPoints);
        isDrawing = false;
        completeDrawBtn.disabled = true;
        // Open zone form
        openZoneForm(null);
    }

    cancelDrawBtn.addEventListener('click', cancelDrawing);
    completeDrawBtn.addEventListener('click', function(e) {
        e.preventDefault();
        completeDrawing();
    });

    function simplifyPoints(points, minDist) {
        minDist = minDist || 4;
        if (points.length <= 2) return points;
        var simplified = [points[0]];
        for (var i = 1; i < points.length - 1; i++) {
            var prev = simplified[simplified.length - 1];
            if (Math.hypot(points[i].x - prev.x, points[i].y - prev.y) >= minDist) {
                simplified.push(points[i]);
            }
        }
        simplified.push(points[points.length - 1]);
        return simplified;
    }

    // ── Click handling on canvas for drawing ──
    container.addEventListener('click', function(e) {
        if (suppressClick) { suppressClick = false; return; }
        if (!isDrawMode || ignoreClick || e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        var coords = clientToImageCoords(e.clientX, e.clientY);
        if (coords.x < 0 || coords.y < 0 || coords.x > imgNatW || coords.y > imgNatH) return;
        // Not drawing yet and clicked an existing zone: edit it.
        if (!currentPoints.length) {
            var hit = getFilteredZones().slice().reverse().find(function(z) {
                var pts = typeof z.points === 'string' ? JSON.parse(z.points) : z.points;
                return pts && pts.length >= 3 && pointInPolygon(coords, pts);
            });
            if (hit) { openZoneForm(hit); return; }
        }

        if (clickTimer) clearTimeout(clickTimer);
        clickTimer = setTimeout(function() {
            addPointAt(coords);
            clickTimer = null;
        }, CLICK_DELAY_MS);
    });

    container.addEventListener('dblclick', function(e) {
        if (!isDrawMode) return;
        e.preventDefault();
        e.stopPropagation();
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        ignoreClick = true;
        setTimeout(function() { ignoreClick = false; }, CLICK_DELAY_MS + 30);
        if (currentPoints.length >= 3) completeDrawing();
    });

    container.addEventListener('mousemove', function(e) {
        if (!isDrawMode || currentPoints.length === 0 || isDragging) return;
        var coords = snapPoint(clientToImageCoords(e.clientX, e.clientY));
        // Redraw saved zones, then draw preview polygon (current points + hover)
        renderAllZones();
        var previewPts = currentPoints.concat([coords]);
        drawPolygon(previewPts, selectedColor, true);
        // Draw vertex dots on existing points
        currentPoints.forEach(function(p) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4 / scale, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = (COLOR_MAP[selectedColor] || COLOR_MAP.green).stroke;
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    });

    // Cursor change for replicate preview hover
    container.addEventListener('mousemove', function(e) {
        if (isDrawMode || isDragging || isReplicateDragging) return;
        if (replicatePreviewPoints && replicatePreviewPoints.length >= 3) {
            var coords = clientToImageCoords(e.clientX, e.clientY);
            container.style.cursor = pointInPolygon(coords, replicatePreviewPoints) ? 'move' : 'grab';
        }
    });

    // Snap to existing vertices first, then to existing edges, so neighbouring zones share
    // exact borders (no slivers or overlaps between floors/units).
    var SNAP_PX = 9;
    function snapPoint(p) {
        var best = null, bestD = SNAP_PX / scale;
        var all = getFilteredZones().map(function(z) { return typeof z.points === 'string' ? JSON.parse(z.points) : z.points; });
        if (currentPoints.length > 2) all.push([currentPoints[0]]);
        all.forEach(function(pts) {
            (pts || []).forEach(function(v) {
                var d = Math.hypot(v.x - p.x, v.y - p.y);
                if (d < bestD) { bestD = d; best = { x: v.x, y: v.y }; }
            });
        });
        if (best) return best;
        bestD = (SNAP_PX * 0.7) / scale;
        all.forEach(function(pts) {
            if (!pts || pts.length < 2) return;
            for (var i = 0; i < pts.length; i++) {
                var a = pts[i], b = pts[(i + 1) % pts.length];
                var dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
                if (!len2) continue;
                var t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
                var q = { x: Math.round(a.x + t * dx), y: Math.round(a.y + t * dy) };
                var d = Math.hypot(q.x - p.x, q.y - p.y);
                if (d < bestD) { bestD = d; best = q; }
            }
        });
        return best || p;
    }

    function addPointAt(coords) {
        if (!isDrawMode) return;
        coords = snapPoint(coords);
        if (currentPoints.length >= 3) {
            var first = currentPoints[0];
            if (Math.hypot(coords.x - first.x, coords.y - first.y) * scale < CLOSE_DISTANCE_PX) {
                completeDrawing();
                return;
            }
        }
        currentPoints.push(coords);
        isDrawing = true;
        completeDrawBtn.disabled = currentPoints.length < 3;
        // Redraw: saved zones + draft (no hover point)
        renderAllZones();
        renderDraft();
        updateEditInstructionText();
    }

    function updateEditInstructionText() {
        if (!isDrawMode) return;
        editInstruction.textContent = currentPoints.length ? currentPoints.length + ' points' : '';
        document.getElementById('bma-draw-controls').hidden = !currentPoints.length;
    }

    // ── Color picker (draw controls) ──
    document.querySelectorAll('#bma-draw-controls .bma-color-opt').forEach(function(el) {
        el.addEventListener('click', function() {
            document.querySelectorAll('#bma-draw-controls .bma-color-opt').forEach(function(o) { o.classList.remove('selected'); });
            el.classList.add('selected');
            selectedColor = el.dataset.color;
        });
    });

    // ── Zone form modal ──
    function openZoneForm(zone) {
        editingZoneId = zone ? zone.id : null;
        document.getElementById('bma-zone-modal-title').textContent = zone ? 'Edit Zone' : 'New Zone';
        document.getElementById('bma-zone-name').value = zone ? zone.name : '';
        document.getElementById('bma-zone-floor').value = zone ? String(zone.floor_number || 0) : '0';
        document.getElementById('bma-zone-panorama').value = zone && zone.linked_panorama_id ? String(zone.linked_panorama_id) : '';
        document.getElementById('bma-zone-floorplan').value = zone && zone.linked_floor_plan_item_id ? String(zone.linked_floor_plan_item_id) : '';
        populateBuildingMapSelect(zone && zone.linked_building_map_id ? String(zone.linked_building_map_id) : '');
        setLinkType(zone ? zoneLinkTypeOf(zone) : defaultLinkType());
        fillMeta(zone ? zone.meta : null);
        editingMeta = zone ? (typeof zone.meta === 'string' ? JSON.parse(zone.meta || '{}') : (zone.meta || {})) : {};
        setZoneError('');
        // Show only the info-card fields that matter at this level.
        var lvl = effectiveLevel();
        document.querySelectorAll('#bma-zone-modal [data-levels]').forEach(function(el) {
            el.hidden = (' ' + el.dataset.levels + ' ').indexOf(' ' + lvl + ' ') < 0;
        });
        renderFloorUnits();
        var canSplit = !zone && currentPoints.length === 4;
        document.getElementById('bma-split-wrap').hidden = !canSplit;
        document.getElementById('bma-split-on').checked = false;
        document.getElementById('bma-split-fields').hidden = true;
        document.getElementById('bma-upload-status').hidden = true;

        // Set color
        var col = (zone ? zone.color : selectedColor) || 'green';
        document.querySelectorAll('#bma-zone-color-options .bma-color-opt').forEach(function(o) {
            o.classList.toggle('selected', o.dataset.color === col);
        });

        modalAnchorPoints = zone ? (typeof zone.points === 'string' ? JSON.parse(zone.points) : zone.points) : currentPoints.slice();
        showFloatingModal('bma-zone-modal');
        modalAnchorPoints = null;
        setTimeout(function() { document.getElementById('bma-zone-name').focus(); }, 100);
    }

    function splitBands(points, count) {
        // Order the 4 corners: top pair (smaller y) and bottom pair, each left to right.
        var pts = points.slice().sort(function(a, b) { return a.y - b.y; });
        var top = pts.slice(0, 2).sort(function(a, b) { return a.x - b.x; });
        var bot = pts.slice(2).sort(function(a, b) { return a.x - b.x; });
        var TL = top[0], TR = top[1], BL = bot[0], BR = bot[1];
        var lerp = function(a, b, t) { return { x: Math.round(a.x + (b.x - a.x) * t), y: Math.round(a.y + (b.y - a.y) * t) }; };
        var bands = [];
        for (var i = 0; i < count; i++) {
            var t0 = i / count, t1 = (i + 1) / count;  // measured from the bottom
            bands.push([lerp(BL, TL, t1), lerp(BR, TR, t1), lerp(BR, TR, t0), lerp(BL, TL, t0)]);
        }
        return bands;
    }

    function splitActive() {
        return !editingZoneId && currentPoints.length === 4 && document.getElementById('bma-split-on').checked;
    }

    function renderSplitPreview() {
        renderAllZones();
        if (!currentPoints.length) return;
        if (!splitActive()) { renderDraft(); return; }
        var n = Math.max(1, Math.min(100, parseInt(document.getElementById('bma-split-count').value) || 1));
        splitBands(currentPoints, n).forEach(function(b, i) {
            drawPolygon(b, selectedColor, i % 2 === 0);
        });
    }

    ['bma-split-on', 'bma-split-count', 'bma-split-start'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', function() {
            document.getElementById('bma-split-fields').hidden = !document.getElementById('bma-split-on').checked;
            renderSplitPreview();
        });
    });

    function zoneLinkTypeOf(z) {
        if (z.link_type) return z.link_type;
        if (z.linked_building_map_id) return 'building_map';
        if (z.linked_floor_plan_item_id) return 'floor_plan';
        if (z.linked_panorama_id) return 'panorama';
        return '';
    }

    function effectiveLevel() {
        var cfg = (mapData && mapData.view_config) || {};
        if (cfg.level) return cfg.level;
        var isChild = buildingMaps.some(function(m) {
            return (m.zones || []).some(function(z) { return z.link === 'building_map' && String(z.target) === String(MAP_ID); });
        });
        return isChild ? 'tower' : 'aerial';
    }

    function defaultLinkType() {
        var lvl = effectiveLevel();
        if (lvl === 'aerial') return 'building_map';
        if (lvl === 'tower') return 'floor_plan';
        return '';
    }


    function setLinkType(t) {
        zoneLinkType = t || '';
        document.querySelectorAll('#bma-link-types .bma-dir-btn').forEach(function(b) {
            var on = b.dataset.link === zoneLinkType;
            b.classList.toggle('selected', on);
            b.setAttribute('aria-checked', on ? 'true' : 'false');
        });
        document.querySelectorAll('[data-link-group]').forEach(function(g) {
            g.hidden = g.dataset.linkGroup !== zoneLinkType;
        });
    }
    document.querySelectorAll('#bma-link-types .bma-dir-btn').forEach(function(b) {
        b.addEventListener('click', function() { setLinkType(b.dataset.link); renderFloorUnits(); });
    });

    // A floor that opens a map with units gets its own status per unit; the floor colour
    // in the customer view is derived from them (any available > any hold > all sold).
    var editingMeta = {};
    function floorUnitsTarget() {
        if (zoneLinkType !== 'building_map') return null;
        var id = document.getElementById('bma-zone-building-map').value;
        var m = buildingMaps.find(function(x) { return String(x.id) === String(id); });
        var units = m ? (m.zones || []).filter(function(z) { return !z.link && z.status; }) : [];
        return units.length ? units : null;
    }
    function renderFloorUnits() {
        var units = floorUnitsTarget();
        var wrap = document.getElementById('bma-floor-units');
        wrap.hidden = !units;
        var statusField = document.querySelector('#bma-zone-modal [data-meta="status"]');
        var statusLabel = statusField && statusField.closest('[data-levels]');
        if (statusLabel) {
            statusLabel.hidden = !!units || (' ' + statusLabel.dataset.levels + ' ').indexOf(' ' + effectiveLevel() + ' ') < 0;
        }
        if (!units) return;
        var overrides = (editingMeta && editingMeta.unit_status) || {};
        document.getElementById('bma-floor-units-list').innerHTML = units.map(function(u) {
            var cur = overrides[String(u.id)] || u.status;
            return '<label class="bma-unit-row"><span>' + esc(u.name) + '</span>' +
                '<select class="form-input" data-unit-status="' + u.id + '">' +
                ['available', 'hold', 'sold'].map(function(k) {
                    return '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + k.charAt(0).toUpperCase() + k.slice(1) + '</option>';
                }).join('') + '</select></label>';
        }).join('');
    }
    document.getElementById('bma-zone-building-map').addEventListener('change', renderFloorUnits);

    function fillMeta(meta) {
        meta = meta || {};
        if (typeof meta === 'string') { try { meta = JSON.parse(meta); } catch (e) { meta = {}; } }
        document.querySelectorAll('#bma-zone-modal [data-meta]').forEach(function(el) {
            var v = meta[el.dataset.meta];
            if (el.type === 'checkbox') el.checked = !!v;
            else el.value = v == null ? '' : String(v);
        });
    }

    function readMeta() {
        var meta = {};
        var keep = (editingZoneId && (zones.find(function(z) { return z.id === editingZoneId; }) || {}).meta) || {};
        if (typeof keep === 'string') { try { keep = JSON.parse(keep); } catch (e) { keep = {}; } }
        Object.keys(keep).forEach(function(k) { meta[k] = keep[k]; });
        document.querySelectorAll('#bma-zone-modal [data-meta]').forEach(function(el) {
            var k = el.dataset.meta;
            var field = el.closest('[data-levels]');
            if (field && field.hidden) return;
            delete meta[k];
            if (el.type === 'checkbox') { if (el.checked) meta[k] = true; return; }
            var v = String(el.value || '').trim();
            if (!v) return;
            meta[k] = el.type === 'number' ? Number(v) : v;
        });
        var unitSelects = document.querySelectorAll('#bma-floor-units:not([hidden]) [data-unit-status]');
        if (unitSelects.length) {
            meta.unit_status = {};
            unitSelects.forEach(function(sel) { meta.unit_status[sel.dataset.unitStatus] = sel.value; });
            delete meta.status;
        } else {
            delete meta.unit_status;
        }
        return meta;
    }

    function setZoneError(msg) {
        var el = document.getElementById('bma-zone-error');
        el.hidden = !msg;
        el.textContent = msg || '';
    }

    // Upload a new building map straight from the zone form.
    document.getElementById('bma-upload-map-btn').addEventListener('click', function() {
        document.getElementById('bma-upload-map-file').click();
    });
    document.getElementById('bma-upload-map-file').addEventListener('change', function() {
        var file = this.files && this.files[0];
        this.value = '';
        if (!file) return;
        var status = document.getElementById('bma-upload-status');
        var btn = document.getElementById('bma-upload-map-btn');
        var zoneName = document.getElementById('bma-zone-name').value.trim();
        var base = zoneName || file.name.replace(/\.[^.]+$/, '');
        var name = base;
        var n = 2;
        var taken = function(nm) { return buildingMaps.some(function(m) { return String(m.name).toLowerCase() === nm.toLowerCase(); }); };
        while (taken(name)) name = base + ' (' + (n++) + ')';
        var fd = new FormData();
        fd.append('name', name);
        fd.append('file', file);
        if (mapData && mapData.workspace_id) fd.append('workspace_id', mapData.workspace_id);
        // The new map sits one level below this one.
        fd.append('level', effectiveLevel() === 'aerial' ? 'tower' : 'floor');
        btn.disabled = true;
        status.hidden = false;
        status.className = 'bma-upload-status';
        status.textContent = 'Uploading…';
        fetch('/api/building-maps', { method: 'POST', headers: authHeaders(), body: fd })
            .then(jsonOrThrow)
            .then(function(created) {
                return loadBuildingMaps().then(function() {
                    populateBuildingMapSelect(String(created.id));
                    status.innerHTML = esc(created.name) + ' &middot; <a href="/building-map/admin/' + created.id + '" target="_blank" rel="noopener">Open &#8599;</a>';
                });
            })
            .catch(function(err) {
                status.className = 'bma-upload-status is-error';
                status.textContent = err.message;
            })
            .then(function() { btn.disabled = false; });

    document.querySelectorAll('#bma-zone-color-options .bma-color-opt').forEach(function(el) {
        el.addEventListener('click', function() {

            el.classList.add('selected');
        });

    document.getElementById('bma-zone-save').addEventListener('click', function() {
        var name = document.getElementById('bma-zone-name').value.trim();
        if (!name) { document.getElementById('bma-zone-name').focus(); return; }
        var floorNumber = parseInt(document.getElementById('bma-zone-floor').value) || 0;
        var colorSel = document.querySelector('#bma-zone-color-options .bma-color-opt.selected');
        var color = colorSel ? colorSel.dataset.color : 'green';
        var linkBody = {
            link_type: zoneLinkType,
            linked_building_map_id: zoneLinkType === 'building_map' ? (document.getElementById('bma-zone-building-map').value || null) : null,
            linked_floor_plan_item_id: zoneLinkType === 'floor_plan' ? (document.getElementById('bma-zone-floorplan').value || null) : null,
            linked_panorama_id: zoneLinkType === 'panorama' ? (document.getElementById('bma-zone-panorama').value || null) : null
        };
        var missingTarget = { building_map: 'Pick or upload the building map this zone opens.', floor_plan: 'Pick a floor plan.', panorama: 'Pick a panorama.' };
        if (zoneLinkType && !linkBody['linked_' + (zoneLinkType === 'floor_plan' ? 'floor_plan_item' : zoneLinkType) + '_id']) {
            setZoneError(missingTarget[zoneLinkType]);
            return;
        }
        var meta = readMeta();
        if (meta.size_min && meta.size_max && meta.size_min > meta.size_max) {
            setZoneError('Size from must be less than size to.');
            return;
        }
        setZoneError('');

        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Saving…';
        var body = Object.assign({ name: name, floor_number: floorNumber, color: color, meta: meta }, linkBody);
        var req;
        if (splitActive()) {
            var count = Math.max(1, Math.min(100, parseInt(document.getElementById('bma-split-count').value) || 1));
            var start = Math.max(0, Math.min(100, parseInt(document.getElementById('bma-split-start').value) || 0));
            if (start + count - 1 > 100) { setZoneError('Floor numbers must stay between 0 and 100.'); btn.disabled = false; btn.textContent = 'Save Zone'; return; }
            var batch = splitBands(currentPoints, count).map(function(pts, i) {
                var fl = start + i;
                var m = Object.assign({}, meta, { label: String(fl) });
                return Object.assign({}, linkBody, { name: name + ' ' + fl, floor_number: fl, color: color, meta: m, points: pts, sort_order: fl });
            });
            req = fetch('/api/building-maps/' + MAP_ID + '/zones/batch', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                body: JSON.stringify({ zones: batch })
            });
        } else if (editingZoneId) {
            req = fetch('/api/building-zones/' + editingZoneId, {
                method: 'PUT',
                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                body: JSON.stringify(body)
            });
        } else {
            body.points = currentPoints.slice();
            req = fetch('/api/building-maps/' + MAP_ID + '/zones', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                body: JSON.stringify(body)
            });
        }
        var wasEditing = !!editingZoneId;
        req.then(jsonOrThrow)
            .then(function() {
                hideFloatingModal('bma-zone-modal');
                if (!wasEditing) { currentPoints = []; updateEditInstructionText(); }
                reloadZones();
                loadBuildingMaps();
                showToast(wasEditing ? 'Zone updated' : 'Zone created');
            })
            .catch(function(err) { setZoneError(err.message); })
            .then(function() { btn.disabled = false; btn.textContent = 'Save Zone'; });
    });

    function reloadZones() {
        fetch('/api/building-maps/' + MAP_ID + '/zones', { headers: authHeaders() })
            .then(jsonOrThrow)
            .then(function(data) {
                zones = Array.isArray(data) ? data : [];
                renderAllZones();
                updateZonesList();
                updateFloorFilter();
            })
            .catch(function(err) { showToast('Could not refresh zones: ' + err.message, true); });
    }

    // ── Zones list panel ──
    function updateZonesList() {
        var filtered = getFilteredZones();
        document.getElementById('bma-zone-count').textContent = filtered.length;
        var list = document.getElementById('bma-zones-list');

        if (!filtered.length) {
            var floorVal = document.getElementById('bma-floor-filter').value;
            list.innerHTML = '<div class="bma-zones-empty">No zones</div>';
            return;
        }

        list.innerHTML = filtered.map(function(z) {
            var c = COLOR_MAP[z.color] || COLOR_MAP.green;
            return '<div class="bma-zone-item" data-id="' + z.id + '">' +
                '<div class="bma-zone-item-name">' +
                    '<div class="bma-zone-item-color" style="background:' + c.stroke + ';"></div>' +
                    esc(z.name) + '<span class="bma-zone-item-floor">F' + z.floor_number + '</span>' +
                '</div>' +
                zoneBadge(z) +
                '<div class="bma-zone-item-actions">' +
                    '<button class="bma-zone-action" data-action="edit" data-id="' + z.id + '" title="Edit">&#9998;</button>' +
                    '<button class="bma-zone-action bma-zone-action-del" data-action="delete" data-id="' + z.id + '" title="Delete">&#10005;</button>' +
                '</div>' +
            '</div>';
        }).join('');

        // Bind zone item events
        list.querySelectorAll('.bma-zone-action').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                var action = btn.dataset.action;
                var zoneId = parseInt(btn.dataset.id);
                var zone = zones.find(function(z) { return z.id === zoneId; });
                if (!zone) return;
                if (action === 'edit') openZoneForm(zone);
                else if (action === 'replicate') openReplicateModal(zone);
                else if (action === 'delete') deleteZone(zone);
            });
        });

        // Hover highlight
        list.querySelectorAll('.bma-zone-item').forEach(function(el) {
            el.addEventListener('mouseenter', function() {
                var zoneId = parseInt(el.dataset.id);
                renderAllZones();
                var zone = zones.find(function(z) { return z.id === zoneId; });
                if (zone) {
                    var pts = typeof zone.points === 'string' ? JSON.parse(zone.points) : zone.points;
                    if (pts && pts.length >= 3) drawPolygon(pts, zone.color || 'green', true);
                }
            });
            el.addEventListener('mouseleave', function() {
                renderAllZones();
            });
        });
    }

    function zoneBadge(z) {
        var t = zoneLinkTypeOf(z);
        var meta = z.meta || {};
        var st = meta.status ? '<i class="bma-st bma-st-' + meta.status + '" title="' + meta.status + '"></i>' : '';
        var label = t === 'building_map' ? '&rarr; ' + esc(mapNameById(z.linked_building_map_id))
            : t === 'floor_plan' ? 'Floor plan'
            : t === 'panorama' ? '360°'
            : (Object.keys(meta).length ? 'Unit' : '');
        return label || st ? '<span class="bma-zone-badge" title="Opens">' + st + label + '</span>' : '';
    }

    // Floor filter
    function updateFloorFilter() {
        var sel = document.getElementById('bma-floor-filter');
        var current = sel.value;
        var floors = [];
        zones.forEach(function(z) {
            var f = z.floor_number || 0;
            if (floors.indexOf(f) === -1) floors.push(f);
        });
        floors.sort(function(a, b) { return a - b; });
        sel.innerHTML = '<option value="all">All Floors</option>';
        floors.forEach(function(f) {
            sel.innerHTML += '<option value="' + f + '"' + (String(f) === current ? ' selected' : '') + '>Floor ' + f + '</option>';
        });
    }

    document.getElementById('bma-floor-filter').addEventListener('change', function() {
        renderAllZones();
        updateZonesList();
    });

    // ── Delete zone ──
    function deleteZone(zone) {
        if (!confirm('Delete zone "' + zone.name + '"?')) return;
        fetch('/api/building-zones/' + zone.id, { method: 'DELETE', headers: authHeaders() })
            .then(jsonOrThrow)
            .then(function() {

    // ── Replicate modal ──
    function openReplicateModal(zone) {
        replicateSourceZone = zone;

    document.getElementById('bma-rep-confirm').addEventListener('click', function() {

    // ── Panel collapse ──
    var panelCollapsed = false;
    document.getElementById('bma-panel-toggle').addEventListener('click', function() {

        var body = document.getElementById('bma-panel-body');

    // ── Panel drag ──
    (function() {
        var panel = document.getElementById('bma-edit-panel');
        var header = panel.querySelector('.panel-header');
        var dragging = false, startX, startY, startLeft, startTop;

        // Switch from fixed bottom/left positioning to top/left for drag
        function ensureTopLeft() {
            if (panel.style.top) return;
            var rect = panel.getBoundingClientRect();
            panel.style.top = rect.top + 'px';
            panel.style.left = rect.left + 'px';
            panel.style.bottom = 'auto';
            panel.style.right = 'auto';
        }

        header.addEventListener('pointerdown', function(e) {
            if (e.target.closest('.panel-toggle-btn')) return;
            ensureTopLeft();
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            var rect = panel.getBoundingClientRect();
            startLeft = rect.left;
            startTop = rect.top;
            header.setPointerCapture(e.pointerId);
            e.preventDefault();
        });
        header.addEventListener('pointermove', function(e) {
            if (!dragging) return;
            var dx = e.clientX - startX;
            var dy = e.clientY - startY;
            var newLeft = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, startLeft + dx));
            var newTop = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, startTop + dy));
            panel.style.left = newLeft + 'px';
            panel.style.top = newTop + 'px';
        });
        header.addEventListener('pointerup', function() { dragging = false; });
    })();

    // ── Click on canvas to select zone (when NOT in draw mode) ──
    container.addEventListener('click', function(e) {
        if (isDrawMode || isDragging) return;
        var coords = clientToImageCoords(e.clientX, e.clientY);
        var filtered = getFilteredZones();
        // Find zone that contains this point
        for (var i = filtered.length - 1; i >= 0; i--) {
            var z = filtered[i];
            var pts = typeof z.points === 'string' ? JSON.parse(z.points) : z.points;
            if (pts && pointInPolygon(coords, pts)) {
                openZoneForm(z);
                break;
            }
        }
    });

    function pointInPolygon(point, polygon) {
        var x = point.x, y = point.y;
        var inside = false;
        for (var i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
            var xi = polygon[i].x, yi = polygon[i].y;
            var xj = polygon[j].x, yj = polygon[j].y;
            var intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    // ═══════════════════════════════════════════════
    // Floating modal system (no backdrop, draggable, collapsible)
    // ═══════════════════════════════════════════════

    var modalAnchorPoints = null;  // image-space points the open dialog should not cover

    function showFloatingModal(id) {
        var modal = document.getElementById(id);
        modal.style.display = '';
        modal.classList.remove('collapsed');
        var w = modal.offsetWidth || 400;
        var h = modal.offsetHeight || 300;
        var left = Math.max(16, (window.innerWidth - w) / 2);
        var top = Math.max(16, (window.innerHeight - h) / 2);
        var pts = modalAnchorPoints;
        if (pts && pts.length) {
            // Place the dialog on whichever side of the shape has more room.
            var rect = container.getBoundingClientRect();
            var xs = pts.map(function(p) { return rect.left + panX + p.x * scale; });
            var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
            var panel = document.getElementById('bma-edit-panel').getBoundingClientRect();
            var leftLimit = panel.right + 16;
            var roomRight = window.innerWidth - 90 - maxX;
            var roomLeft = minX - leftLimit;
            if (roomRight >= w + 24) left = maxX + 24;
            else if (roomLeft >= w + 24) left = minX - w - 24;
            else left = roomRight > roomLeft ? window.innerWidth - w - 90 : leftLimit;
            top = Math.max(16, Math.min(window.innerHeight - h - 16, 72));
        }
        modal.style.left = Math.max(16, left) + 'px';
        modal.style.top = top + 'px';
    }

    function hideFloatingModal(id) {
        var modal = document.getElementById(id);
        modal.style.display = 'none';
        // If closing zone modal and we were creating (not editing), clear draft
        if (id === 'bma-zone-modal' && !editingZoneId) {
            currentPoints = [];
            updateEditInstructionText();
            renderAllZones();
        }
        // If closing replicate modal, clear preview
        if (id === 'bma-replicate-modal') {
            replicatePreviewPoints = null;
            replicateSourceZone = null;
            renderAllZones();
        }
    }

    // Close buttons
    document.querySelectorAll('[data-close]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            hideFloatingModal(btn.dataset.close);
        });
    });

    // Collapse buttons
    document.querySelectorAll('[data-collapse]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var modal = document.getElementById(btn.dataset.collapse);
            modal.classList.toggle('collapsed');
            btn.textContent = modal.classList.contains('collapsed') ? '+' : '\u2212';
        });
    });

    // Drag handles
    (function initDragHandles() {
        var dragState = { active: false, modal: null, offsetX: 0, offsetY: 0 };

        document.querySelectorAll('[data-drag-handle]').forEach(function(handle) {
            handle.addEventListener('mousedown', function(e) {
                // Don't drag if clicking a button inside the titlebar
                if (e.target.closest('button')) return;
                var modal = document.getElementById(handle.dataset.dragHandle);
                var rect = modal.getBoundingClientRect();
                dragState.active = true;
                dragState.modal = modal;
                dragState.offsetX = e.clientX - rect.left;
                dragState.offsetY = e.clientY - rect.top;
                e.preventDefault();
            });
        });

        window.addEventListener('mousemove', function(e) {
            if (!dragState.active) return;
            var x = e.clientX - dragState.offsetX;
            var y = e.clientY - dragState.offsetY;
            // Clamp to viewport
            x = Math.max(0, Math.min(window.innerWidth - 60, x));
            y = Math.max(0, Math.min(window.innerHeight - 40, y));
            dragState.modal.style.left = x + 'px';
            dragState.modal.style.top = y + 'px';
        });

        window.addEventListener('mouseup', function() {
            dragState.active = false;
        });
    })();

    // ── Utility ──
    function esc(s) {
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }

    function showToast(msg, isError) {
        var tc = document.getElementById('bma-toast-container');
        var el = document.createElement('div');
        el.className = 'bma-toast' + (isError ? ' is-error' : '');
        el.setAttribute('role', isError ? 'alert' : 'status');
        el.textContent = msg;
        tc.appendChild(el);
        setTimeout(function() { el.remove(); }, 3000);
    }
})();
</script>
</body>
</html>
