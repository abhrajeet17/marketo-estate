{# Dashboard header: organisation name and the most recently edited panoramas. #}
<header class="dash-topbar">
    <div class="dash-topbar__title">
        <h1 class="dash-topbar__org" id="org-name">MarketoState</h1>
        <p class="dash-topbar__sub">Plot Marker</p>
    </div>
    <nav class="dash-recents" aria-label="Recently edited">
        <span class="dash-recents__label">Recent</span>
        <div class="dash-recents__track" id="dash-recents">
            <span class="dash-skel dash-skel--chip"></span>
            <span class="dash-skel dash-skel--chip"></span>
            <span class="dash-skel dash-skel--chip"></span>
        </div>
    </nav>
</header>
