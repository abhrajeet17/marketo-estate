{% from 'components/dashboard/modal.html' import modal %}
{% call(section) modal('change-password-modal', 'Change password', 'Use at least 6 characters.') %}
{% if section == 'body' %}
<label class="dash-field">
    <span class="dash-field__label">New password</span>
    <input class="dash-input" type="password" name="password" minlength="6" required autocomplete="new-password" data-autofocus>
</label>
<label class="dash-field">
    <span class="dash-field__label">Confirm new password</span>
    <input class="dash-input" type="password" name="confirm" minlength="6" required autocomplete="new-password">
</label>
{% else %}
<button type="button" class="dash-btn" data-modal-dismiss>Cancel</button>
<button type="submit" class="dash-btn dash-btn--primary" data-submit>Update password</button>
{% endif %}
{% endcall %}
